
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan HTML Table Layout</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        table {
            width: 600px;
            height: 400px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid;
            padding: 0;
        }

        /* Header */
        header {
            background-color: #917f6a;
            border: 1px solid rgb(197, 134, 17);
            height: 65px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Navigasi */
        nav {
            background-color: #dce8fc;
            border: 1px solid #5491f1;
            height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Konten utama */
        main {
            background-color: #f6cccc;
            border: 1px solid #e77c7c;
            height: 255px;
            padding: 30px 42px;
            box-sizing: border-box;
        }

        main h1 {
            font-size: 24px;
            margin: 16px 0;
        }

        main p {
            font-size: 13px;
            line-height: 1.1;
            margin: 0;
        }

        /* Sidebar */
        aside {
            background-color: #d6e8d3;
            border: 1px solid #6ad45a;
            height: 250px;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        aside ul {
            margin-top: 10px;
            padding-left: 40px;
            font-size: 13px;
        }

        /* Footer */
        footer {
            background-color: #ffead1;
            border: 1px solid orange;
            height: 39px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .label {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <table>
        <!-- HEADER -->
        <tr>
            <td colspan="2">
                <header>
                    <span class="label">HEADER</span>
                </header>
            </td>
        </tr>

        <!-- NAVIGASI -->
        <tr>
            <td colspan="2">
                <nav>
                    <span class="label">NAVIGASI</span>
                </nav>
            </td>
        </tr>

        <!-- KONTEN DAN MENU -->
        <tr>
            <td style="width: 450px;">
                <main>
                    <h1>Heading 1</h1>
                    <p>
                        Lorem ipsum dolor sit amet, consectetur
                        adipisicing elit, sed do eiusmod tempor
                        incididunt ut labore et dolore magna aliqua.
                    </p>
                </main>
            </td>

            <td style="width: 150px;">
                <aside>
                    <div class="label">Menu:</div>
                    <ul>
                        <li>Home</li>
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>
                </aside>
            </td>
        </tr>

        <!-- FOOTER -->
        <tr>
            <td colspan="2">
                <footer>
                    <span class="label">FOOTER</span>
                </footer>
            </td>
        </tr>
    </table>

</body>
</html>
